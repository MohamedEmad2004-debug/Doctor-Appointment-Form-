<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Appointment Form</title>
  <style>
    /* 1) ضبط عام */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      border-top: 1px solid #000;          /* الخط الأسود الرفيع فوق */
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      color: #000;
    }

    /* 2) الحاوية: عمودين جنب بعض */
    .container {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: flex-start;
      min-height: 630px;
    }

    /* 3) عمود الصورة */
    .photo {
      flex: 0 0 691px;
      width: 691px;
    }

    .photo svg,
    .photo img {
      display: block;
      width: 691px;
      height: 630px;
      object-fit: contain;
    }

    /* 4) عمود الفورم */
    .form {
      flex: 0 0 477px;
      width: 477px;
    }

    .form h1 {
      margin: 26px 0 0;
      font-size: 32px;
      line-height: 36px;
      text-align: center;
      font-weight: bold;
    }

    .form hr {
      border: 0;
      border-top: 2px solid #ff0000;       /* الخط الأحمر */
      margin: 22px 0 8px;
    }

    /* 5) الجدول (بيرتب اللابل والحقول) */
    table {
      border-collapse: collapse;
      width: 100%;
    }

    td {
      padding: 10px 0;
      vertical-align: middle;
    }

    td.label {
      width: 104px;
      padding-right: 8px;
    }

    tr.top td {
      vertical-align: top;
    }

    /* 6) الحقول */
    input[type="text"],
    input[type="tel"] {
      height: 20px;
      font-size: 13px;
    }

    input.half {
      width: 176px;
    }

    input.half + input.half {
      margin-left: 20px;                   /* الفراغ بين First و Last */
    }

    textarea {
      width: 314px;
      height: 66px;
      display: block;
    }

    /* 7) الـ checkboxes */
    input[type="checkbox"] {
      margin: 3px 4px 3px 4px;
    }

    .send {
      margin-top: 10px;
      font-family: inherit;
      font-size: 15px;
      padding: 1px 6px;
      cursor: pointer;
    }

    /* 8) الموبايل: نخفي الصورة ونخلي الفورم ياخد العرض */
    @media (max-width: 600px) {
      .photo { display: none; }
      .form  { flex: 1 1 auto; width: 100%; padding: 0 16px; }
      input.half { width: 45%; }
      textarea { width: 100%; }
    }

  </style>
</head>
<body>

  <div class="container">

    <!-- ===== العمود الشمال: صورة الدكتورة ===== -->
    <div class="photo">
      <img src="images.jpg" alt="Doctor">
    </div>

    <!-- ===== العمود اليمين: الفورم ===== -->
    <form class="form" action="#" method="post">
      <h1>Doctor Appointment Form</h1>
      <hr>

      <table>
        <tr>
          <td class="label"><label for="date">Appointment Date</label></td>
          <td><input type="date" id="date" name="date"></td>
        </tr>

        <tr>
          <td class="label"><label for="time">Appointment Time</label></td>
          <td><input type="time" id="time" name="time"></td>
        </tr>

        <tr>
          <td class="label"><label for="first">Name</label></td>
          <td>
            <input type="text" id="first" name="first" class="half" placeholder="First">
            <input type="text" id="last" name="last" class="half" placeholder="Last">
          </td>
        </tr>

        <tr>
          <td class="label">Gender</td>
          <td>
            Male <input type="radio" name="gender" value="male">Female <input type="radio" name="gender" value="female" checked>
          </td>
        </tr>

        <tr>
          <td class="label"><label for="phone">Phone</label></td>
          <td><input type="tel" id="phone" name="phone" class="half" placeholder="####"></td>
        </tr>

        <tr>
          <td class="label"><label for="city">Address</label></td>
          <td>
            <input type="text" id="city" name="city" class="half" placeholder="city">
            <input type="text" id="state" name="state" class="half" placeholder="state">
          </td>
        </tr>

        <tr>
          <td class="label"><label for="query">Your Query</label></td>
          <td><textarea id="query" name="query"></textarea></td>
        </tr>

        <tr class="top">
          <td class="label">Appointment Type</td>
          <td>
            Select which appointment type(s) you require<br>
            <label><input type="checkbox" name="type" value="cervix" checked> Cervix checkup</label><br>
            <label><input type="checkbox" name="type" value="heart" checked> Heart checkup</label><br>
            <label><input type="checkbox" name="type" value="eye"> Eye check-up</label><br>
            <label><input type="checkbox" name="type" value="hearing"> Hearing Test</label>
          </td>
        </tr>

        <tr>
          <td></td>
          <td><button type="submit" class="send">Send</button></td>
        </tr>
      </table>
    </form>

  </div>

</body>
</html>
